name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Exposed so the deploy step can skip cleanly until the secret is added.
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use the repository npm version
        run: npm install --global npm@11.17.0

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 059284548080aff62b4040122ca6a7c5
          command: pages deploy dist --project-name=bloom-pomodoro --branch=main

      - name: Note if deploy was skipped
        if: ${{ env.CF_TOKEN == '' }}
        run: |
          echo "::notice::Build succeeded but deploy was skipped — add the CLOUDFLARE_API_TOKEN repo secret to enable auto-deploy."
