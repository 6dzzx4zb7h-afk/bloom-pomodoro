# The repository had no CI at all: the deploy workflow went out with the legacy
# tooling, so nothing ran the suite except a person remembering to.
#
# The Node matrix is deliberate. A Vitest/jsdom interaction on Node >= 22.4 once
# took 13 tests down on main while passing for anyone on an older runtime, so a
# single pinned version is exactly the shape of bug this repo has already hit.
# package.json declares node >=22, so both ends of that promise get tested.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # ci, not install: the lockfile is the contract, and a resolution that
      # drifts from it should fail here rather than on someone's machine.
      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build
